---
layout: default
---

<article class="post fade-in-up">
  <header class="post-header">
    <h1 class="post-title">{{ page.title }}</h1>
    <p class="post-meta">
      <time datetime="{{ page.date | date_to_xmlschema }}">
        {{ page.date | date: "%Y-%m-%d" }}
      </time>
      {% if page.author %} • {{ page.author }}{% endif %}
    </p>
  </header>
  
  <div class="post-content glass-panel">
    {{ content }}
  </div>
  
  <footer class="post-footer">
    <a href="{{ '/blog/' | relative_url }}" class="back-link">← 返回博客列表</a>
  </footer>
</article>
